[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enzkin"
version = "0.1.0"
description = "Kinetic (Boltzmann) electron dynamics for epsilon-near-zero conducting oxides: ground-truth solver and learned collision closure"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.13", "numba>=0.60", "h5py>=3.10"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running physics checks (deselect with -m 'not slow')"]
